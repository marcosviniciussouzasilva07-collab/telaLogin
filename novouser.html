<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registo - Novo Usuário</title>
  
  <!-- O ficheiro CSS mantido para garantir que o estilo continua igual -->
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>

  <!-- ===================================================
       HTML DA PÁGINA DE REGISTO
  =================================================== -->

  <h1>Criar Nova Conta</h1>

  <!-- Caixa de seleção de navegação -->
  <!-- Nota: A opção 'Novo Usuário' tem agora o atributo 'selected' -->
  <select class="centro" onchange="if (this.value) window.location.href = this.value;">
    <option value="" disabled>Escolha uma opção</option>
    <option value="index.html">Sou Usuário</option>
    <option value="novouser.html" selected>Novo Usuário</option>
  </select>
  <br><br>

  <!-- O formulário adaptado para o registo -->
  <form class="caixa-login">

    <div class="campo">
      <label for="nome">Nome Completo:</label>
      <input type="text" id="nome" placeholder="Digite o seu nome" required>
    </div>

    <div class="campo">
      <label for="email">E-mail:</label>
      <input type="email" id="email" placeholder="Digite o seu e-mail" required>
    </div>

    <div class="campo">
      <label for="senha">Senha:</label>
      <input type="password" id="senha" placeholder="Crie uma senha" required>
    </div>

    <div class="campo">
      <label for="confirmar-senha">Confirmar Senha:</label>
      <input type="password" id="confirmar-senha" placeholder="Repita a senha" required>
    </div>

    <div class="campo">
      <button class="botao-enviar" type="submit">Criar Conta</button>
    </div>

    <div class="campo" style="text-align:center;">
      <a href="index.html">Já tenho uma conta. Voltar ao Login.</a>
    </div>

  </form>

</body>
</html>
